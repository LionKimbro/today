[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "today"
version = "0.1.0"
description = "Today daily cockpit"
requires-python = ">=3.11"
dependencies = ["machine-root>=0.1.0", "Pillow>=10.0", "tkinterdnd2>=0.4.4"]

[project.scripts]
today = "today.main:main"

[tool.setuptools.packages.find]
where = ["src"]
